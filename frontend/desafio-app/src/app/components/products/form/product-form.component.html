<div class="container">
  <h1 *ngIf="!isEditMode">Cadastrar Produto</h1>
  <h1 *ngIf="isEditMode">Editar Produto</h1>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="name">Nome</label>
      <input id="name" type="text" formControlName="name">
      <div class="error" *ngIf="name?.touched && name?.invalid">
        <span *ngIf="name?.errors?.['required']">O nome é obrigatório.</span>
        <span *ngIf="name?.errors?.['maxlength']">O nome é muito longo.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="description">Descrição</label>
      <textarea id="description" formControlName="description"></textarea>
      <div class="error" *ngIf="description?.touched && description?.invalid">
        <span *ngIf="description?.errors?.['maxlength']">A descrição é muito longa.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="price">Preço (R$)</label>
      <input id="price" type="number" formControlName="price" step="1">
      <div class="error" *ngIf="price?.touched && price?.invalid">
        <span *ngIf="price?.errors?.['required']">O preço é obrigatório.</span>
        <span *ngIf="price?.errors?.['min']">O preço deve ser maior ou igual a zero.</span>
      </div>
    </div>

    <div class="buttons">
      <button type="submit">
        {{ isEditMode ? 'Salvar' : 'Cadastrar' }}
      </button>
      <button type="button" (click)="onCancel()">Cancelar</button>
    </div>

    <div *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </div>
  </form>
</div>
